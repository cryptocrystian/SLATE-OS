[project]
name = "buildos-worker"
version = "0.1.0"
description = "BuildOS execution-plane worker (docs/83). Claims runs from the SLATE control plane and executes the lane."
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
buildos-worker = "buildos_worker.cli:main"

[dependency-groups]
dev = [
  "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buildos_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
